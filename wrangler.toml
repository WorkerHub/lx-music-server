name = "lx-music-server"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "USER_SYNC"
class_name = "UserSyncDO"

# Single instance holding the user registry (accounts, statuses, tombstones and
# registration settings). Serialized requests make duplicate-name checks atomic.
[[durable_objects.bindings]]
name = "USER_REGISTRY"
class_name = "UserRegistryDO"

[[kv_namespaces]]
binding = "KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSyncDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserRegistryDO"]

# IP rate limiting for the credential-bearing endpoints: /ah, /api/register and
# /api/admin/login (see README "限流"). Each uses its own key namespace.
# namespace_id must be a positive integer unique within your Cloudflare account.
# Change it if another Worker/binding on your account already uses "1001".
# A namespace_id conflict surfaces as a deploy error; check your existing
# Workers rate-limit bindings in the Cloudflare dashboard and pick an unused id.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
SERVER_NAME = "LX Music Server"
