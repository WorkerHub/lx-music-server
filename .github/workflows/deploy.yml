name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare config and secrets file
        env:
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          LX_USERS: ${{ secrets.LX_USERS }}
        run: |
          # LX_USERS secret 格式:
          #   简单模式: user1:password1,user2:password2
          #   JSON 模式: [{"name":"user1","password":"xxx"},{"name":"user2","password":"yyy","maxSnapshotNum":30}]
          #   JSON 模式也支持 passwordHash: [{"name":"user1","passwordHash":"<32位hex MD5>"}]
          python3 - <<'EOF'
          import os, json, sys

          # Inject the KV namespace id into wrangler.toml (config, not secret).
          kv_namespace_id = os.environ.get("KV_NAMESPACE_ID", "")
          with open('wrangler.toml', 'r') as f:
              content = f.read()
          content = content.replace('KV_NAMESPACE_ID_PLACEHOLDER', kv_namespace_id)
          with open('wrangler.toml', 'w') as f:
              f.write(content)

          # Build the LX_USERS secret value (a JSON array string) and write it to
          # a secrets file that wrangler deploy uploads alongside the code. This
          # keeps plaintext passwords out of wrangler.toml [vars], which are
          # visible in the Cloudflare dashboard.
          raw = os.environ.get("LX_USERS", "").strip()
          if not raw:
              print("::error:: LX_USERS secret is empty or missing; refusing to deploy an empty user list", file=sys.stderr)
              sys.exit(1)

          if raw.startswith("["):
              try:
                  users = json.loads(raw)
              except json.JSONDecodeError as e:
                  print(f"::error:: LX_USERS is not valid JSON: {e}", file=sys.stderr)
                  sys.exit(1)
          else:
              users = []
              for pair in raw.split(","):
                  pair = pair.strip()
                  if not pair:
                      continue
                  parts = pair.split(":", 1)
                  users.append({"name": parts[0], "password": parts[1] if len(parts) > 1 else ""})

          if not isinstance(users, list):
              print("::error:: LX_USERS must be a JSON array of user objects", file=sys.stderr)
              sys.exit(1)

          if not users:
              print("::error:: LX_USERS resolves to an empty user list; refusing to deploy", file=sys.stderr)
              sys.exit(1)

          for u in users:
              if not isinstance(u, dict):
                  print("::error:: LX_USERS: each entry must be an object", file=sys.stderr)
                  sys.exit(1)
              name = u.get("name")
              if not name:
                  print("::error:: LX_USERS: every user needs a non-empty 'name'", file=sys.stderr)
                  sys.exit(1)
              if not (u.get("password") or u.get("passwordHash")):
                  print(f"::error:: LX_USERS: user '{name}' needs a non-empty 'password' or 'passwordHash'", file=sys.stderr)
                  sys.exit(1)

          users_json = json.dumps(users)
          with open('.secrets.json', 'w') as f:
              json.dump({"LX_USERS": users_json}, f)
          EOF

      - name: Deploy
        shell: bash
        run: |
          set -o pipefail
          pnpm wrangler deploy --secrets-file .secrets.json 2>&1 | sed -E \
            -e 's/env\.LX_USERS \(".*"\)/env.LX_USERS (***)/g' \
            -e 's/env\.KV[^ ]* \([^)]*\)/env.KV (***)/g' \
            -e 's#https://([a-z0-9-]+)\.[a-z0-9-]+\.workers\.dev/?#https://\1.***.workers.dev/#gI'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}