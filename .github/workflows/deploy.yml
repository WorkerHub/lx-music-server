name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare config and secrets file
        env:
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          LX_USERS: ${{ secrets.LX_USERS }}
          LX_ADMIN_PASSWORD_HASH: ${{ secrets.LX_ADMIN_PASSWORD_HASH }}
        run: |
          # LX_USERS secret 格式（必填，非空；仅用于首次播种；播种后由 Registry DO 管理用户）:
          #   简单模式: user1:password1,user2:password2
          #   JSON 模式: [{"name":"user1","password":"xxx"},{"name":"user2","password":"yyy","maxSnapshotNum":30}]
          #   JSON 模式也支持 passwordHash: [{"name":"user1","passwordHash":"<32位hex MD5>"}]
          # LX_ADMIN_PASSWORD_HASH secret 格式（必填，缺失则部署失败）:
          #   管理员密码的 SHA-256（64 位小写 hex）。
          #   注意：从 GitHub Secrets 删除它不会移除 Worker 上已有的 secret，
          #   停用面板还需手动执行 `wrangler secret delete LX_ADMIN_PASSWORD_HASH`。
          python3 - <<'EOF'
          import os, json, re, sys

          # KV_NAMESPACE_ID 来自仓库 Variable（vars），非 Secret。
          kv_namespace_id = os.environ.get("KV_NAMESPACE_ID", "").strip()
          if not kv_namespace_id:
              print("::error:: KV_NAMESPACE_ID is required: set the repository Variable (vars.KV_NAMESPACE_ID) to the KV namespace id", file=sys.stderr)
              sys.exit(1)
          with open('wrangler.toml', 'r') as f:
              content = f.read()
          content = content.replace('KV_NAMESPACE_ID_PLACEHOLDER', kv_namespace_id)
          with open('wrangler.toml', 'w') as f:
              f.write(content)

          # Build the LX_USERS secret value (a JSON array string) and write it to
          # a secrets file that wrangler deploy uploads alongside the code. This
          # keeps plaintext passwords out of wrangler.toml [vars], which are
          # visible in the Cloudflare dashboard. LX_USERS is required (non-empty).
          raw = os.environ.get("LX_USERS", "").strip()
          if not raw:
              print("::error:: LX_USERS is required: set the repository secret to a non-empty user list", file=sys.stderr)
              sys.exit(1)
          users = []
          if raw:
              if raw.startswith("["):
                  try:
                      users = json.loads(raw)
                  except json.JSONDecodeError as e:
                      print(f"::error:: LX_USERS is not valid JSON: {e}", file=sys.stderr)
                      sys.exit(1)
              else:
                  for pair in raw.split(","):
                      pair = pair.strip()
                      if not pair:
                          continue
                      parts = pair.split(":", 1)
                      users.append({"name": parts[0], "password": parts[1] if len(parts) > 1 else ""})

              if not isinstance(users, list):
                  print("::error:: LX_USERS must be a JSON array of user objects", file=sys.stderr)
                  sys.exit(1)

              for u in users:
                  if not isinstance(u, dict):
                      print("::error:: LX_USERS: each entry must be an object", file=sys.stderr)
                      sys.exit(1)
                  name = u.get("name")
                  if not name:
                      print("::error:: LX_USERS: every user needs a non-empty 'name'", file=sys.stderr)
                      sys.exit(1)
                  if not (u.get("password") or u.get("passwordHash")):
                      print(f"::error:: LX_USERS: user '{name}' needs a non-empty 'password' or 'passwordHash'", file=sys.stderr)
                      sys.exit(1)

          secrets = {"LX_USERS": json.dumps(users)}

          # LX_ADMIN_PASSWORD_HASH is required: the admin panel is part of the
          # deployed surface, so a deployment without it is not a valid release.
          # Fail loudly instead of silently shipping with /admin disabled.
          admin_hash = os.environ.get("LX_ADMIN_PASSWORD_HASH", "").strip().lower()
          if not admin_hash:
              print("::error:: LX_ADMIN_PASSWORD_HASH is required: set the repository secret to the 64-character hex SHA-256 digest of the admin password", file=sys.stderr)
              sys.exit(1)
          if not re.fullmatch(r"[0-9a-f]{64}", admin_hash):
              print("::error:: LX_ADMIN_PASSWORD_HASH must be a 64-character hex SHA-256 digest", file=sys.stderr)
              sys.exit(1)
          secrets["LX_ADMIN_PASSWORD_HASH"] = admin_hash

          runner_temp = os.environ.get("RUNNER_TEMP", "")
          if not runner_temp:
              print("::error:: RUNNER_TEMP is not set in the environment", file=sys.stderr)
              sys.exit(1)
          secrets_path = os.path.join(runner_temp, "secrets.json")
          fd = os.open(secrets_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'w') as f:
              json.dump(secrets, f)
          EOF

      - name: Deploy
        shell: bash
        run: |
          set -o pipefail
          # Public build metadata (not secrets): the panel's home footer and
          # about page read it through GET /api/admin/build-info. BUILD_COMMIT
          # must be the SHA this workflow actually deployed, which under
          # workflow_run is head_sha, not github.sha.
          BUILD_VERSION="$(node -p "require('./package.json').version")"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "build info: version=$BUILD_VERSION commit=$BUILD_COMMIT builtAt=$BUILD_TIME"
          pnpm wrangler deploy \
            --secrets-file "$RUNNER_TEMP/secrets.json" \
            --var "BUILD_VERSION:$BUILD_VERSION" \
            --var "BUILD_COMMIT:$BUILD_COMMIT" \
            --var "BUILD_TIME:$BUILD_TIME" 2>&1 | sed -E \
            -e 's/env\.LX_USERS \(".*"\)/env.LX_USERS (***)/g' \
            -e 's/env\.LX_ADMIN_PASSWORD_HASH \(".*"\)/env.LX_ADMIN_PASSWORD_HASH (***)/g' \
            -e 's/env\.KV[^ ]* \([^)]*\)/env.KV (***)/g' \
            -e 's#https://([a-z0-9-]+)\.[a-z0-9-]+\.workers\.dev/?#https://\1.***.workers.dev/#gI'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
