name: Manual Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., v1.2.0). Must match the version in package.json (v + version)'
        required: true
        type: string

# GITHUB_TOKEN is deliberately granted nothing: checkout and the tag push below
# use the PAT_TOKEN secret, and giving the auto token contents:write would widen
# the blast radius for no reason. Replacing the long-lived PAT with a GitHub App
# or a fine-grained token is tracked as a follow-up (see REVIEW L8) — it cannot
# be done from this workflow file alone.
permissions: {}

jobs:
  create-tag:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "❌ Error: Tag format is invalid. Must be semantic version like v1.0.0"
            echo "Provided: $TAG"
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG"

      - name: Validate PAT token
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [[ -z "$PAT_TOKEN" ]]; then
            echo "❌ Error: PAT_TOKEN secret is not configured"
            exit 1
          fi
          echo "✅ PAT_TOKEN is configured"
      
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Use PAT instead of default GITHUB_TOKEN so pushing the tag can trigger follow-up workflows.
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Check if tag already exists
        run: |
          TAG="${{ inputs.tag }}"
          if git tag -l | grep -q "^${TAG}$"; then
            echo "❌ Error: Tag '$TAG' already exists"
            echo "Existing tags:"
            git tag -l | tail -10
            exit 1
          fi
          echo "✅ Tag '$TAG' does not exist, proceeding..."

      - name: Validate tag matches package.json version
        run: |
          TAG="${{ inputs.tag }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "❌ Error: Tag '$TAG' does not match package.json version '$PKG_VERSION'"
            echo "Provided tag: $TAG"
            echo "package.json version: $PKG_VERSION"
            exit 1
          fi
          echo "✅ Tag '$TAG' matches package.json version '$PKG_VERSION'"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create and push tag
        run: |
          TAG="${{ inputs.tag }}"
          echo "Creating tag: $TAG"
          git tag "$TAG"
          echo "Pushing tag to remote..."
          git push origin "$TAG"
          echo "✅ Successfully created and pushed tag: $TAG"
          echo "🚀 This will trigger the automatic release workflow"